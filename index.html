<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Quest</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">877-word challenge</p>
        <h1>Word Quest</h1>
        <p class="tagline">Level up starter, HSPT, ISEE, and SSAT vocab in quick rounds.</p>
      </div>
      <div class="top-actions">
        <nav class="site-nav" aria-label="Site pages">
          <a class="nav-link active" href="index.html">Game</a>
          <a class="nav-link" href="about.html">About Me</a>
          <a class="nav-link" href="https://github.com/dev-with-liam/vocab-practice">GitHub</a>
        </nav>
        <div class="stats" aria-label="Study progress">
          <span><small>XP</small><strong id="masteredCount">0</strong></span>
          <span><small>Combo</small><strong id="streakCount">0</strong></span>
        </div>
      </div>
    </header>

    <main class="app-shell">
      <aside class="sidebar" aria-label="Study controls">
        <section>
          <h2>World</h2>
          <div id="setButtons" class="set-grid"></div>
        </section>

        <section>
          <h2>Challenge</h2>
          <div class="segmented" role="tablist" aria-label="Practice mode">
            <button class="mode-button active" data-mode="flashcards" type="button">Flip</button>
            <button class="mode-button" data-mode="quiz" type="button">Synonyms</button>
            <button class="mode-button" data-mode="opposites" type="button">Opposites</button>
            <button class="mode-button" data-mode="list" type="button">Vault</button>
          </div>
        </section>

        <section>
          <h2>Mini-games</h2>
          <div class="segmented" role="tablist" aria-label="Mini-games">
            <button class="mode-button" data-mode="match" type="button">Match</button>
            <button class="mode-button" data-mode="sort" type="button">Sort</button>
            <button class="mode-button" data-mode="scramble" type="button">Scramble</button>
          </div>
        </section>

        <section>
          <h2>Power-ups</h2>
          <label class="check-row">
            <input id="missedOnly" type="checkbox">
            <span>Train weak words</span>
          </label>
          <label class="check-row">
            <input id="shuffleCards" type="checkbox" checked>
            <span>Random rounds</span>
          </label>
        </section>

        <section>
          <h2>Save Data</h2>
          <div class="tool-grid">
            <button id="resetProgress" class="secondary" type="button">Reset</button>
            <button id="exportProgress" class="secondary" type="button">Copy</button>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <div class="progress-strip">
          <div>
            <span id="scopeLabel">All sets</span>
            <strong id="scopeCount">877 words</strong>
            <em id="rankLabel">Rookie Rank</em>
          </div>
          <div class="bar" aria-hidden="true"><span id="progressBar"></span></div>
        </div>

        <section id="flashcardsPanel" class="panel active" aria-live="polite">
          <div class="card-stage">
            <article id="flashcard" class="flashcard" tabindex="0">
              <p id="cardSet" class="card-meta">Set 1</p>
              <h2 id="cardWord">Word</h2>
              <p id="cardPrompt">Tap to reveal clues</p>
              <div id="cardAnswer" class="card-answer" hidden></div>
            </article>
          </div>
          <div class="action-row">
            <button id="prevCard" class="secondary" type="button">Previous</button>
            <button id="flipCard" type="button">Reveal</button>
            <button id="nextCard" class="secondary" type="button">Next</button>
          </div>
          <div class="action-row">
            <button id="markMissed" class="danger" type="button">Need Practice</button>
            <button id="markMastered" class="success" type="button">Got It</button>
          </div>
        </section>

        <section id="quizPanel" class="panel" aria-live="polite">
          <div class="question-card">
            <p id="quizMeta" class="card-meta"></p>
            <h2 id="quizQuestion"></h2>
            <div id="quizOptions" class="options"></div>
          </div>
          <p id="quizFeedback" class="feedback"></p>
          <div class="action-row">
            <button id="nextQuiz" type="button">Next Round</button>
          </div>
        </section>

        <section id="matchPanel" class="panel" aria-live="polite">
          <div class="game-card">
            <p id="matchMeta" class="card-meta"></p>
            <h2 id="matchWord"></h2>
            <p id="matchPrompt" class="sentence"></p>
            <div id="matchOptions" class="chip-grid"></div>
          </div>
          <p id="matchFeedback" class="feedback"></p>
          <div class="action-row">
            <button id="nextMatch" type="button">New Match</button>
          </div>
        </section>

        <section id="sortPanel" class="panel" aria-live="polite">
          <div class="game-card">
            <p id="sortMeta" class="card-meta"></p>
            <h2 id="sortWord"></h2>
            <p id="sortClue" class="sort-clue"></p>
            <div class="action-row">
              <button id="sortSynonym" type="button">Synonym</button>
              <button id="sortAntonym" class="secondary" type="button">Opposite</button>
            </div>
          </div>
          <p id="sortFeedback" class="feedback"></p>
          <div class="action-row">
            <button id="nextSort" type="button">New Sort</button>
          </div>
        </section>

        <section id="scramblePanel" class="panel" aria-live="polite">
          <div class="game-card">
            <p id="scrambleMeta" class="card-meta"></p>
            <h2 id="scrambleClue"></h2>
            <div id="scrambleAnswer" class="answer-slots"></div>
            <div id="scrambleLetters" class="letter-bank"></div>
          </div>
          <p id="scrambleFeedback" class="feedback"></p>
          <div class="action-row">
            <button id="clearScramble" class="secondary" type="button">Clear</button>
            <button id="nextScramble" type="button">New Scramble</button>
          </div>
        </section>

        <section id="listPanel" class="panel">
          <div class="word-list-head">
            <input id="searchWords" type="search" placeholder="Search words, synonyms, or antonyms">
            <span id="listCount"></span>
          </div>
          <div id="wordList" class="word-list"></div>
        </section>
      </section>
    </main>

    <script src="data/vocabulary.js?v=20260923a"></script>
    <script src="data/exam-vocabulary.js?v=20260923a"></script>
    <script src="data/simple-vocabulary.js?v=20260923a"></script>
    <script src="data/hspt-pdf-vocabulary.js?v=20260923a"></script>
    <script src="app.js?v=20260923a"></script>
  </body>
</html>
